<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura | Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="login.css"/>
</head>

<body>
  <div id="loginPage">
    <div class="login-wrapper">

      <!-- Heading -->
      <div class="login-header">
        <h1>Login to Aura</h1>
        <p>Enter your credentials to access the portfolio engine.</p>
      </div>

      <!-- Card with form -->
      <div class="login-card">
        <input type="text"     id="username" placeholder="USERNAME" />
        <input type="password" id="password" placeholder="PASSWORD" />
        <button class="btn-login" onclick="login()">Login</button>
        <p id="errorMsg" class="error-msg"></p>
      </div>

    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
